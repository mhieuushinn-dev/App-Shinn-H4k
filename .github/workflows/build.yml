name: Build ShinnH4K IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen || brew upgrade xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Clean build folder
        run: rm -rf build && mkdir -p build

      - name: Archive (unsigned)
        run: |
          xcodebuild archive \
            -project ShinnH4K.xcodeproj \
            -scheme ShinnH4K \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/ShinnH4K.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA (unsigned)
        run: |
          APP_PATH=$(find build/ShinnH4K.xcarchive/Products/Applications -maxdepth 1 -name "*.app" -type d | head -1)
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -qr ShinnH4K.ipa Payload
          cd ..

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShinnH4K-unsigned-ipa
          path: build/ShinnH4K.ipa
          retention-days: 30
