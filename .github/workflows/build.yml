name: Build ShinnH4K IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode
        run: |
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen version

      - name: Check project files
        run: |
          echo "=== Root ==="
          ls -la

          echo "=== project.yml ==="
          test -f project.yml

          echo "=== ShinnH4K ==="
          ls -la ShinnH4K || true

      - name: Generate Xcode project
        run: |
          set -e

          rm -rf ShinnH4K.xcodeproj

          xcodegen generate --spec project.yml

          test -d ShinnH4K.xcodeproj
          test -f ShinnH4K.xcodeproj/project.pbxproj

          echo "=== Generated ==="
          ls -la ShinnH4K.xcodeproj

      - name: Fix project format for Xcode 15
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("ShinnH4K.xcodeproj/project.pbxproj")

          text = p.read_text()

          # Xcode 15-compatible project format
          text = text.replace(
              'objectVersion = 70;',
              'objectVersion = 56;'
          )

          text = text.replace(
              'objectVersion = 77;',
              'objectVersion = 56;'
          )

          p.write_text(text)

          print("Project format adjusted for Xcode 15")
          PY

      - name: Verify project
        run: |
          set -e

          echo "=== Project file ==="
          head -20 ShinnH4K.xcodeproj/project.pbxproj

          echo "=== Xcode project list ==="
          xcodebuild \
            -list \
            -project ShinnH4K.xcodeproj

      - name: Clean
        run: |
          rm -rf build
          mkdir -p build

      - name: Archive unsigned
        run: |
          set -o pipefail

          xcodebuild archive \
            -project ShinnH4K.xcodeproj \
            -scheme ShinnH4K \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/ShinnH4K.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            IPHONEOS_DEPLOYMENT_TARGET=17.0

      - name: Find application
        run: |
          echo "=== Archive contents ==="

          find build/ShinnH4K.xcarchive \
            -maxdepth 6 \
            -print

          APP_PATH=$(find \
            build/ShinnH4K.xcarchive/Products/Applications \
            -maxdepth 1 \
            -name "*.app" \
            -type d \
            2>/dev/null | head -1)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app found"
            exit 1
          fi

          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Package IPA
        run: |
          set -e

          APP_NAME=$(basename "$APP_PATH" .app)

          rm -rf build/Payload
          mkdir -p build/Payload

          cp -R "$APP_PATH" "build/Payload/$APP_NAME.app"

          rm -rf \
            "build/Payload/$APP_NAME.app/_CodeSignature"

          rm -f \
            "build/Payload/$APP_NAME.app/embedded.mobileprovision"

          cd build

          zip -qr ShinnH4K.ipa Payload

          cd ..

          echo "=== IPA created ==="
          ls -lh build/ShinnH4K.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ShinnH4K-unsigned-ipa
          path: build/ShinnH4K.ipa
          retention-days: 30