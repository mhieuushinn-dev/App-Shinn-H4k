name: Build ShinnH4K IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show project info
        run: |
          echo "=== Files ==="
          ls -la
          echo "=== Xcodeproj ==="
          ls -la ShinnH4K.xcodeproj/ || echo "MISSING XCODEPROJ"
          echo "=== Schemes ==="
          xcodebuild -list -project ShinnH4K.xcodeproj || true

      - name: Archive (unsigned)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project ShinnH4K.xcodeproj \
            -scheme ShinnH4K \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/ShinnH4K.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            -verbose

      - name: List archive contents
        if: always()
        run: |
          echo "=== Archive tree ==="
          find build/ShinnH4K.xcarchive -maxdepth 4 -type d 2>/dev/null || true

      - name: Package IPA (unsigned)
        run: |
          APP_PATH=$(find build/ShinnH4K.xcarchive/Products/Applications -maxdepth 1 -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app found in archive"
            find build/ShinnH4K.xcarchive -maxdepth 5 2>/dev/null || true
            exit 1
          fi
          echo "Found app: $APP_PATH"
          APP_NAME=$(basename "$APP_PATH" .app)
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          rm -rf build/Payload/${APP_NAME}.app/_CodeSignature || true
          rm -f build/Payload/${APP_NAME}.app/embedded.mobileprovision || true
          cd build
          zip -qr ShinnH4K.ipa Payload
          cd ..
          ls -la build/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ShinnH4K-unsigned-ipa
          path: build/ShinnH4K.ipa
          retention-days: 30