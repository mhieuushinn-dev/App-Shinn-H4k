      - name: Generate Xcode project
        run: |
          # Kiểm tra xem project.yml nằm ở đâu và chuyển hướng nếu cần
          if [ -f "ShinnH4K/project.yml" ]; then
            cd ShinnH4K
          fi

          if [ ! -f project.yml ]; then
            echo "ERROR: project.yml not found"
            exit 1
          fi
          
          xcodegen generate
          
          # Đưa file xcodeproj ra thư mục gốc nếu project.yml nằm trong thư mục con
          if [ -d "ShinnH4K.xcodeproj" ] && [ ! -d "../ShinnH4K.xcodeproj" ]; then
            mv ShinnH4K.xcodeproj ../
            cd ..
          fi
          
          echo "=== Generated ==="
          ls -la ShinnH4K.xcodeproj/ || echo "MISSING xcodeproj"
