name: ShinnH4K
options:
  bundleIdPrefix: com.shinnh4k
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"

targets:
  ShinnH4K:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ShinnH4K
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_NAME: ShinnH4K
        PRODUCT_BUNDLE_IDENTIFIER: com.apple.mobile.MobileHouseArrest
        INFOPLIST_FILE: ShinnH4K/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: ShinnH4K/ShinnH4K-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/ShinnH4K"
          - "$(SRCROOT)/ShinnH4K/exploit"
          - "$(SRCROOT)/ShinnH4K/kexploit"
          - "$(SRCROOT)/ShinnH4K/helpers"
        LIBRARY_SEARCH_PATHS:
          - "$(SRCROOT)/ShinnH4K"
        OTHER_LDFLAGS: "-lz"
        OTHER_CFLAGS: "-Wno-everything"
        ENABLE_BITCODE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: "NO"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"