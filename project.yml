name: ShinnH4K
options:
  bundleIdPrefix: com.shinn
targets:
  ShinnH4K:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: .
        excludes:
          - .github
          - build
          - ShinnH4K.xcodeproj
    settings:
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: ""
      DEVELOPMENT_TEAM: ""
      INFOPLIST_FILE: Info.plist
      SWIFT_OBJC_BRIDGING_HEADER: ShinnH4K-BridgingHeader.h
